[project]
name = "swipex-career-intelligence"
version = "0.1.0"
description = "SwipeX AI/ML Career Intelligence & Resume ATS Service (Milestone 1)"
authors = [{ name = "SwipeX Intern 3", email = "intern3@swipex.local" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "B008",  # FastAPI Depends/File/Header in function parameter defaults
    "E501",  # Line length handled by formatter
    "B904",  # Exception chaining
]
